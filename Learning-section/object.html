        // learning object
        let learnObj = function () {

            // declaring an object
            let user = {
                name: "yuvi",
                age: 21
            };

            // accessing keys in an object
            console.log(user.name);
            console.log(user.age);

            // --> Add the key in an object
            user.sex = "male";

            //calling the object
            console.log(user);
            // Now sex is add in user object

            // ----> importance of square brackets[]

            // lets add new key without square brackets

            // user.admin access = true;
            // This will through SyntaxError 

            // user []
            user["admin access"] = true;

            // more systamatic way 
            let key = "user access"
            user[key] = true;

            console.log(user);

            // --------> Computed properties 

            // Eg of normal property
            let student = {
                name: "Yuvi"
            }

            // Eg of computed property
            let key1 = "name";

            let stdnt = {
                [key1]: "Yuvidon"
            }

            console.log(stdnt);
            // output =>  Object { name: "Yuvidon" }

            // another Eg
            let fruit = "apple";

            let bag = {
                [fruit]: 5
            };

            console.log(bag);

            // --------> "in" operator

            console.log("apple" in bag);
            // [in] operator just return boolean value only

            // --------> "for...in" loop in object
            let obj1 = {
                name: "yuvi",
                age: 21,
                isAdmin: true
            }

            // using for loop
            for (let key in obj1) {

                console.log(key, " = ", obj1[key]);
            }

            // Ordered like an object
            // in javascipt when loop the intergers key in object it will automatically access value in accending value
            let object2 = {
                "5": "value3",
                "4": "value2",
                "3": "value1"
            }

            for (let keys in object2) {

                console.log(keys, " = ", object2[keys]);
            }
            // output
            // 3  =  value1 
            // 4  =  value2 
            // 5  =  value3
        }

        //object reference and copying
        function referencesAndCopy() {
            // Primitives copy by value
            // Strings, numbers, and booleans are independently copied.
            let message = "Hello";
            let phrase = message;
            phrase = "Hi";

            console.log(message);
            // message is still "Hello"


            // Objects copy by reference
            // An object variable holds a reference to the object.Assigning it to another variable copies that reference, so both variables point to the same object.
            let usr = { name: "John" };
            let admin = usr;

            admin.name = "Pete";
            console.log(usr.name); // "Pete"

            // Object equality is identity equality
            // Two variables are equal only when they reference the exact same object.
            let a = {};
            let b = a;
            console.log(a === b); // true

            // two totally different object
            let x = {};
            let y = {};
            console.log(x === y); // false

            // const prevents reassignment, not object edits
            // You cannot replace the reference, but you can change the object’s properties.
            const usr1 = { name: "John" };
            usr1.name = "Pete";     // allowed
            // usr1 = {};           // error

            // Shallow cloning and merging with Object.assign
            // Object.assign(target, ...sources) copies properties into the target, overwriting duplicate property names.Object.assign({}, obj) creates a new top - level object.Spread syntax({ ...obj }) does the same kind of shallow copy.
            const usr2 = { name: "John", age: 30 };
            const clon = Object.assign({}, usr2);

            clon.name = "Pete";
            console.log(usr2.name); // "John"

            // Nested objects reveal the limit of a shallow copy
            // Their nested objects are still shared by reference.
            const usr3 = { name: "John", sizes: { width: 50 } };
            const clone1 = Object.assign({}, usr3);

            clone1.sizes.width = 60;
            console.log(usr3.sizes.width); // 60

            // Deep cloning with structuredClone
            // structuredClone(obj) recursively copies nested objects, arrays, and supports circular references.It cannot clone functions.
            const usr4 = { name: "John", sizes: { width: 50 } };
            const clone = structuredClone(usr4);

            clone.sizes.width = 60;
            console.log(usr4.sizes.width); // 50
        }
