<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="mystyle.css">
  <title>Todo app</title>
</head>

<body>
  <div class="container">
    <header>
      <div class="heroname">Todo</div>

      <!-- input date from javascript. -->
      <div class="date"></div>
    </header>

    <div class="main">
      <form>
        <input type="text" id="input-task" placeholder=" Add a task and press Enter " />
        <button type="submit" onclick="addEvents()">Add</button>
      </form>
      <div class="filters">
        <button class="data-filter" id="filter-all">All</button>
        <button class="data-filter" id="filter-active">Active</button>
        <button class="data-filter" id="filter-done">Done</button>
      </div>
      <div class="msg">Nothing here. Add a task above</div>
      <p id="tasks"> </p>
    </div>

    <div class="footer">
      <div class="task-left">0 Tasks left</div>
      <button id="clearDoneButton"> Clear Completed</button>
    </div>
  </div>
  <script src="todo.js"></script>
</body>

</html>
