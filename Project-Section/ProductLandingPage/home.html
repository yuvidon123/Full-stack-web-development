<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Product Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="nav-header">
      <div class="head-container">
        <div class="logo-name">
          <h3>BrewBox</h3>
        </div>
        <ul>
          <li>Home</li>
          <li>Features</li>
          <li>Pricing</li>
          <li>Contact</li>
        </ul>
      </div>
    </div>
    <div class="main">
          <div class="face-info">
            <h1>Coffee, Delivered <br> Fresh</h1>
            <p>Subscribe to BrewBox and get freshly roasted beans delivered to your doorstep every month.</p>
            <button>Get Started</button>
          </div>
        </div>
        <div class="face-photo">
          <img src="coffee.png" alt="Coffee photo" width="10rem" height="10rem">
        </div>
  </body>
</html>
