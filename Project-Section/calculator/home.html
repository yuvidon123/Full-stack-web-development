<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link rel="stylesheet" href="homeStyle.css" />
  </head>
  <body>
    <header>Calculator</header>
    <main>
      <div class="output">
        <output id="result"></output>
        <output id="buttons-val"></output>
      </div>
      <div class="input-buttons">
        <button class="operators" id="clear">C</button>
        <button class="operators" id="backspace">⌫</button>
        <button class="operators" id="module">%</button>
        <button class="operators" id="divide">÷</button>
        <button class="operands" id="seven">7</button>
        <button class="operands" id="eight">8</button>
        <button class="operands" id="nine">9</button>
        <button class="operators" id="multiply">x</button>
        <button class="operands" id="four">4</button>
        <button class="operands" id="five">5</button>
        <button class="operands" id="six">6</button>
        <button class="operators" id="minus">-</button>
        <button class="operands" id="six">1</button>
        <button class="operands" id="six">2</button>
        <button class="operands" id="six">3</button>
        <button class="operators" id="plus">+</button>
        <button class="operands" id="double zero">00</button>
        <button class="operands" id="zero">0</button>
        <button class="operands" id="point">.</button>
        <button class="operators" id="equal">=</button>
    </div>
    </main>
  </body>
</html>
